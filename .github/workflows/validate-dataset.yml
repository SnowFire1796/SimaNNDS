name: Validate Persian dataset

on:
  push:
    branches: [main]
    paths:
      - "corpus/**"
      - "conversations/**"
      - "tools/validate_dataset.py"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "conversations/**"
      - "tools/validate_dataset.py"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate dataset
        run: python3 tools/validate_dataset.py
